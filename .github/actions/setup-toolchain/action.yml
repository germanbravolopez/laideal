name: Set up the La Ideal toolchain
description: >
  Ninja, Qt 6.4.3 + MinGW 11.2 (the GCC Qt was built with), optionally Inno Setup and
  ccache. Qt, MinGW and the ccache directory are cached between runs. One recipe for
  every job in ci.yml.

inputs:
  inno-setup:
    description: Also install Inno Setup (packaging jobs).
    default: 'false'
  ccache-key:
    description: Compile cache name (e.g. release, ui-test); empty = no ccache.
    default: ''

runs:
  using: composite
  steps:
    - name: Install Ninja
      shell: pwsh
      run: |
        $pkgs = @('ninja')
        if ('${{ inputs.inno-setup }}' -eq 'true') { $pkgs += 'innosetup' }
        if ('${{ inputs.ccache-key }}' -ne '') { $pkgs += 'ccache' }
        choco install @pkgs -y --no-progress
        if ($LASTEXITCODE -ne 0) { throw "choco install $pkgs failed" }

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.4.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        cache: true

    # Qt 6.4.3 win64_mingw is built with MinGW 11.2 (MSVCRT). Build with that same
    # GCC: the runner's preinstalled C:\mingw64 is a newer UCRT toolchain whose
    # binaries fail to load against Qt's bundled libstdc++ (0xC0000139), and Qt's
    # own tools_mingw1120 is no longer on the Qt online repo. Same GCC/libstdc++
    # version as README §Build (C:\Qt\Tools\mingw1120_64).
    - name: Restore MinGW 11.2
      uses: actions/cache@v4
      with:
        path: C:\ProgramData\chocolatey\lib\mingw
        key: mingw-11.2.0.07112021

    - name: Install MinGW 11.2 (matches Qt 6.4.3)
      shell: pwsh
      run: |
        # The community feed intermittently answers "package not found": retry before failing.
        $bin = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
        for ($i = 1; $i -le 4 -and -not (Test-Path "$bin\g++.exe"); $i++) {
          choco install mingw --version=11.2.0.07112021 -y --no-progress
          if (-not (Test-Path "$bin\g++.exe")) { Write-Host "MinGW install attempt $i failed; retrying in 30 s"; Start-Sleep -Seconds 30 }
        }
        if (-not (Test-Path "$bin\g++.exe")) { throw "MinGW 11.2 g++ not found at $bin" }
        & "$bin\g++.exe" --version | Select-Object -First 1
        $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # CMake picks the launcher up from the environment; each run saves a new cache
    # entry and restores the newest one of its kind (same branch first, then its base).
    - name: Configure ccache
      if: inputs.ccache-key != ''
      shell: pwsh
      run: |
        "CCACHE_DIR=$env:RUNNER_TEMP\ccache" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "CCACHE_MAXSIZE=500M" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "CMAKE_CXX_COMPILER_LAUNCHER=ccache" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Restore the compile cache
      if: inputs.ccache-key != ''
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}\ccache
        key: ccache-${{ inputs.ccache-key }}-${{ github.sha }}
        restore-keys: ccache-${{ inputs.ccache-key }}-
