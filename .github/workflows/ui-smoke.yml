name: UI smoke

# Drives the installed app like a person on a disposable windows-latest VM (see
# docs/testing/ui_smoke.md): builds the UI-test build (CMake LAIDEAL_UI_TEST, which
# adds the --fake-aeat switch; never a release), packages and installs it silently
# as the release job does, installs a printer queue whose jobs are captured, then
# runs the smoke test blocks A-E (tests/ui/smoke.py) against the fake AEAT and a
# synthetic database (never shop data: the repository is public), and the AEAT
# pre-production script in its dry run. Screenshots, control trees on failure, the
# printed jobs, logs and databases are kept as the `ui-smoke` artifact.
#
# Run it before a release (/release step 1): gh workflow run ui-smoke.yml --ref release/X.Y

on:
  workflow_dispatch:
  # Every pull request to master runs it (release/X.Y included); never on every push.
  pull_request:
    branches: [ master ]
  push:
    branches: [ '**', '!master' ]
    paths:
      - 'tests/ui/**'
      - 'tests/tools/**'
      - '.github/workflows/ui-smoke.yml'

jobs:
  ui-smoke:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja and Inno Setup
        run: choco install ninja innosetup -y --no-progress

      - name: Install Qt + MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      # Same MinGW 11.2 as ci.yml (Qt 6.4.3's runtime); see the comment there.
      - name: Install MinGW 11.2 (matches Qt 6.4.3)
        shell: pwsh
        run: |
          $bin = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          for ($i = 1; $i -le 4 -and -not (Test-Path "$bin\g++.exe"); $i++) {
            choco install mingw --version=11.2.0.07112021 -y --no-progress
            if (-not (Test-Path "$bin\g++.exe")) { Write-Host "MinGW install attempt $i failed; retrying in 30 s"; Start-Sleep -Seconds 30 }
          }
          if (-not (Test-Path "$bin\g++.exe")) { throw "MinGW 11.2 g++ not found at $bin" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build the UI-test app and the test tools
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLAIDEAL_UI_TEST=ON -DCMAKE_CXX_COMPILER=C:/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin/g++.exe
          cmake --build build --target laideal fake_aeat_server escpos_preview

      # The release job refuses an exe with this switch; check here that the marker it
      # looks for is really in a UI-test build, so that guard cannot silently go blind.
      - name: Check the UI-test marker the release guard looks for
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("build\src\app\laideal.exe")
          $marker = [Text.Encoding]::Unicode.GetBytes('--fake-aeat')
          $text = [BitConverter]::ToString($bytes)
          if (-not $text.Contains([BitConverter]::ToString($marker))) { throw "The UI-test build has no --fake-aeat marker" }
          Write-Host "Marker found: the release guard would refuse this exe."

      - name: Package the installer and the tools
        id: package
        shell: pwsh
        run: |
          if ((Get-Content CMakeLists.txt -Raw) -notmatch 'project\s*\(\s*laideal\s+VERSION\s+([0-9]+\.[0-9]+)') {
            throw "Could not find project(laideal VERSION X.Y) in CMakeLists.txt"
          }
          $ver = $matches[1]
          $stage = "releases\$ver"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item build\src\app\laideal.exe $stage
          windeployqt --no-translations --no-system-d3d-compiler "$stage\laideal.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" releases\laideal.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }
          echo "INSTALLER=$PWD\releases\setup_outputs\laideal_setup_$ver.exe" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Path ui-tools -Force | Out-Null
          foreach ($tool in 'fake_aeat_server', 'escpos_preview') {
            Copy-Item "build\tests\$tool.exe" ui-tools
            windeployqt --no-translations --no-system-d3d-compiler "ui-tools\$tool.exe"
            if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for $tool" }
          }

      - name: Install silently
        id: install
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\La Ideal"
          $p = Start-Process -FilePath '${{ steps.package.outputs.INSTALLER }}' -Wait -PassThru `
               -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LANG=spanish', "/DIR=`"$dir`"", "/LOG=`"$env:RUNNER_TEMP\install.log`""
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          if (-not (Test-Path "$dir\laideal.exe")) { throw "laideal.exe not installed in $dir" }
          echo "EXE=$dir\laideal.exe" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the test's Python packages
        run: python -m pip install --quiet -r tests/ui/requirements.txt

      - name: Add the capturing printer queue
        run: python tests/ui/printer.py install

      # The build's Qt is taken off PATH: the installed app and the deployed tools must
      # start on the DLLs next to them.
      - name: Run the UI smoke test (blocks A-E)
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Qt\\' -and $_ -notmatch 'mingw' }) -join ';'
          python tests/ui/smoke.py --exe '${{ steps.install.outputs.EXE }}' --tools ui-tools --out ui-smoke-out `
                 --printer LaIdeal-Smoke --installer '${{ steps.package.outputs.INSTALLER }}'

      - name: Dry run of the AEAT pre-production script (fake AEAT)
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Qt\\' -and $_ -notmatch 'mingw' }) -join ';'
          python tests/ui/aeat_preproduction.py --exe '${{ steps.install.outputs.EXE }}' --dry-run `
                 --tools ui-tools --out ui-smoke-out\aeat-dry-run

      - name: Keep the run's outputs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ui-smoke-out -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP\install.log" ui-smoke-out -ErrorAction SilentlyContinue
          Copy-Item "$HOME\.laideal.log" ui-smoke-out -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-smoke
          path: ui-smoke-out
          if-no-files-found: ignore
