name: CI

# Branches (CONTRIBUTING.md, Development workflow): work goes into develop; master
# holds only releases and moves only by pull request. One run per commit:
#
#   PR to develop            build + ui-smoke
#   push to develop          build                      (direct commits, merged PRs)
#   PR to master             build + ui-smoke + release in dry run (packages the
#                            installer, checks version and notes, publishes nothing)
#   push to master           build + release: tags X.Y on the merge commit and
#                            publishes the GitHub Release with the exe built here
#   workflow_dispatch        build + ui-smoke on any branch
#
# master requires build, ui-smoke and release to pass before a PR can merge.

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

# A newer push makes the running check obsolete; a publishing run on master is never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45   # a hung step must not hold the runner for the 6 h default

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-toolchain
        with:
          ccache-key: release

      # The aeat_xsd test validates the direct AEAT client's XML against the official
      # AEAT schemas with Python + lxml (it is skipped where lxml is missing).
      - name: Install lxml for the AEAT schema check
        run: python -m pip install --quiet lxml

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=C:/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin/g++.exe

      - name: Build
        run: |
          cmake --build build
          ccache --show-stats

      # Guard against the toolchain mismatch coming back: every built exe must link
      # the MSVCRT runtime that Qt's MinGW 11.2 DLLs use, never the UCRT one.
      - name: Check runtime of built executables
        shell: pwsh
        run: |
          $objdump = Get-ChildItem "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin\objdump.exe" -ErrorAction Stop
          $bad = @()
          foreach ($exe in Get-ChildItem build -Recurse -Filter *.exe -File | Where-Object { $_.FullName -notmatch 'CMakeFiles' }) {
            $dlls = & $objdump.FullName -p $exe.FullName | Select-String 'DLL Name: (\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
            if ($dlls -match '^api-ms-win-crt-') { $bad += $exe.Name }
          }
          if ($bad) { throw "Built with a UCRT toolchain (mismatches Qt's MinGW 11.2 runtime): $($bad -join ', ')" }
          Write-Host "All executables link msvcrt.dll."

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error --timeout 120 --parallel 4
          $code = $LASTEXITCODE
          & .github/scripts/Render-TestSummary.ps1 -Title "Test results"
          exit $code

      # The ticket_preview test renders a sample recibo + factura to PNG. GitHub
      # strips inline images from the run summary (it shows the ASCII receipt
      # instead), so upload the graphical PNG renders as a downloadable artifact.
      - name: Upload ticket previews
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ticket-previews
          path: build/tests/preview_*.png
          if-no-files-found: ignore

      # A failing suite on the runner may print nothing through ctest: its junit report
      # names the failing test function and message.
      - name: Upload test results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: build/test-results-*.xml
          if-no-files-found: ignore

      # The release job packages exactly this tested exe.
      - name: Upload the exe
        uses: actions/upload-artifact@v7
        with:
          name: laideal
          path: build/src/app/laideal.exe

  # Drives the installed app like a person (docs/testing/ui_smoke.md): builds the
  # UI-test build (CMake LAIDEAL_UI_TEST, which adds the --fake-aeat switch; never a
  # release), packages it with the release recipe and installs it silently, installs
  # a printer queue whose jobs are captured, then runs the smoke test blocks A-E
  # (tests/ui/smoke.py) against the fake AEAT and a synthetic database (never shop
  # data: the repository is public), and the AEAT pre-production script in its dry
  # run. Screenshots, control trees on failure, the printed jobs, logs and databases
  # are kept as the `ui-smoke` artifact. Runs on pull requests and on demand, in
  # parallel with build.
  ui-smoke:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-toolchain
        with:
          inno-setup: 'true'
          ccache-key: ui-test

      - name: Build the UI-test app and the test tools
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLAIDEAL_UI_TEST=ON -DCMAKE_CXX_COMPILER=C:/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin/g++.exe
          cmake --build build --target laideal fake_aeat_server escpos_preview

      # The release packaging refuses an exe with this switch; check here that the marker
      # it looks for is really in a UI-test build, so that guard cannot silently go blind.
      - name: Check the UI-test marker the release guard looks for
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("build\src\app\laideal.exe")
          $marker = [Text.Encoding]::Unicode.GetBytes('--fake-aeat')
          $text = [BitConverter]::ToString($bytes)
          if (-not $text.Contains([BitConverter]::ToString($marker))) { throw "The UI-test build has no --fake-aeat marker" }
          Write-Host "Marker found: the release guard would refuse this exe."

      - name: Package the installer and the tools
        id: package
        shell: pwsh
        run: |
          if ((Get-Content CMakeLists.txt -Raw) -notmatch 'project\s*\(\s*laideal\s+VERSION\s+([0-9]+\.[0-9]+)') {
            throw "Could not find project(laideal VERSION X.Y) in CMakeLists.txt"
          }
          $ver = $matches[1]
          & releases\package.ps1 -Exe build\src\app\laideal.exe -Version $ver -OutDir ui-package -AllowUiTest
          echo "INSTALLER=$PWD\ui-package\laideal_setup_$ver.exe" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Path ui-tools -Force | Out-Null
          foreach ($tool in 'fake_aeat_server', 'escpos_preview') {
            Copy-Item "build\tests\$tool.exe" ui-tools
            windeployqt --no-translations --no-system-d3d-compiler "ui-tools\$tool.exe"
            if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for $tool" }
          }

      - name: Install silently
        id: install
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\La Ideal"
          $p = Start-Process -FilePath '${{ steps.package.outputs.INSTALLER }}' -Wait -PassThru `
               -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LANG=spanish', "/DIR=`"$dir`"", "/LOG=`"$env:RUNNER_TEMP\install.log`""
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          if (-not (Test-Path "$dir\laideal.exe")) { throw "laideal.exe not installed in $dir" }
          echo "EXE=$dir\laideal.exe" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the test's Python packages
        run: python -m pip install --quiet -r tests/ui/requirements.txt

      - name: Add the capturing printer queue
        run: python tests/ui/printer.py install

      # The build's Qt is taken off PATH: the installed app and the deployed tools must
      # start on the DLLs next to them.
      - name: Run the UI smoke test (blocks A-E)
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Qt\\' -and $_ -notmatch 'mingw' }) -join ';'
          python tests/ui/smoke.py --exe '${{ steps.install.outputs.EXE }}' --tools ui-tools --out ui-smoke-out `
                 --printer LaIdeal-Smoke --installer '${{ steps.package.outputs.INSTALLER }}'

      - name: Dry run of the AEAT pre-production script (fake AEAT)
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Qt\\' -and $_ -notmatch 'mingw' }) -join ';'
          python tests/ui/aeat_preproduction.py --exe '${{ steps.install.outputs.EXE }}' --dry-run `
                 --tools ui-tools --out ui-smoke-out\aeat-dry-run

      - name: Keep the run's outputs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ui-smoke-out -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP\install.log" ui-smoke-out -ErrorAction SilentlyContinue
          Copy-Item "$HOME\.laideal.log" ui-smoke-out -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-smoke
          path: ui-smoke-out
          if-no-files-found: ignore

  # Packages the exe the build job tested. On a PR to master it is the dry run (the
  # merge cannot pass without it): the version must be new and higher than the
  # latest release, both notes files need its section, and the installer must build
  # (kept as the `installer` artifact). On the push to master that follows the merge
  # it publishes: tag X.Y on this commit + GitHub Release with the zip, the
  # installer, its .sha256 and the bilingual notes.
  release:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.base_ref == 'master')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write   # gh release create (and its tag) on master
      actions: read     # download-artifact from the build job
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v5

      - name: Check the version
        id: version
        shell: pwsh
        run: |
          if ((Get-Content CMakeLists.txt -Raw) -notmatch 'project\s*\(\s*laideal\s+VERSION\s+([0-9]+\.[0-9]+)') {
            throw "Could not find project(laideal VERSION X.Y) in CMakeLists.txt"
          }
          $ver = $matches[1]
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          # Every merge into master is a release: it must bump the version.
          $tagCommit = git ls-remote origin "refs/tags/$ver^{}" "refs/tags/$ver" | Select-Object -First 1
          if ($tagCommit) {
            # A re-run of this publishing run after a transient failure is allowed.
            if ($env:PUBLISH -eq 'true' -and $tagCommit.Split()[0] -eq '${{ github.sha }}') {
              Write-Host "Tag $ver already on this commit: re-publishing."
              echo "RERUN=true" >> $env:GITHUB_OUTPUT
              exit 0
            }
            throw "Version $ver is already released. Bump project(laideal VERSION ...) in CMakeLists.txt."
          }
          $latest = gh release view --json tagName -q .tagName 2>$null
          if ($latest -and [version]$ver -le [version]$latest) {
            throw "Version $ver is not higher than the latest release $latest."
          }
          Write-Host "Version $ver (latest release: $latest)"

      - name: Extract release notes for this version
        id: release_notes
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.VERSION }}'
          # Spanish first (the shop's language), then English. The body is what the
          # in-app updater shows before installing, so a missing or empty section in
          # either file fails the release.
          function Get-Section([string]$file) {
            $raw = Get-Content $file -Raw
            $m = [regex]::Match($raw, "(?ms)^$([regex]::Escape($ver))\r?\n(.*?)(?=^\r?\d+\.\d+\r?\n|\z)")
            if (-not $m.Success) { throw "No release notes section for version $ver in $file. Add a '$ver' block first." }
            $section = $m.Groups[1].Value.TrimEnd()
            if ([string]::IsNullOrWhiteSpace($section)) { throw "Release notes section for version $ver is empty in $file." }
            return $section
          }
          $es = Get-Section 'releases_notes_es.txt'
          $en = Get-Section 'releases_notes.txt'
          $body = "## Español`n`n$es`n`n## English`n`n$en"
          $tmp = Join-Path $env:RUNNER_TEMP "laideal_release_$ver.md"
          Set-Content -Path $tmp -Value $body -Encoding utf8
          echo "NOTES_PATH=$tmp" >> $env:GITHUB_OUTPUT

      # windeployqt (Qt) and the MinGW runtime it copies; nothing is compiled here.
      - uses: ./.github/actions/setup-toolchain
        with:
          inno-setup: 'true'

      - name: Download the tested exe
        uses: actions/download-artifact@v8
        with:
          name: laideal
          path: dist

      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter laideal.exe -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw "laideal.exe not found in the 'laideal' artifact from the build job." }
          & releases\package.ps1 -Exe $exe.FullName -Version '${{ steps.version.outputs.VERSION }}' -OutDir out

      - name: Keep the installer (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: out

      - name: Publish the GitHub Release
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.VERSION }}'
          if ('${{ steps.version.outputs.RERUN }}' -eq 'true') {
            gh release view $ver 2>$null
            if ($LASTEXITCODE -eq 0) {
              gh release delete $ver --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete the half-published release $ver" }
            }
          }
          gh release create $ver "out\$ver.zip" "out\laideal_setup_$ver.exe" "out\laideal_setup_$ver.exe.sha256" `
              --target '${{ github.sha }}' --title "Release $ver" --notes-file '${{ steps.release_notes.outputs.NOTES_PATH }}'
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
